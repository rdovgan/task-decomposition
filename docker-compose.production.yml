version: "3.8"

services:
  # Next.js production server (frontend)
  app:
    build:
      context: .
      target: production
    container_name: task-decomp-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - postgres
    restart: always
    networks:
      - task-decomp-prod-network

  # Express API server (backend)
  server:
    build:
      context: .
      target: production
    container_name: task-decomp-server-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
    command: node dist/server/index.js
    restart: always
    networks:
      - task-decomp-prod-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: task-decomp-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskdecomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-task_decomposition_prod}
    ports:
      - "5434:5432"  # Different port to avoid conflict
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - task-decomp-prod-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskdecomp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: task-decomp-redis-prod
    ports:
      - "6381:6379"  # Different port to avoid conflict
    volumes:
      - redis_prod_data:/data
    networks:
      - task-decomp-prod-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  task-decomp-prod-network:
    driver: bridge
