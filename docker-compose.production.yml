services:
  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: task-decomp-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskdecomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-task_decomposition_prod}
    ports:
      - "5434:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - task-decomp-prod-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskdecomp} -d ${POSTGRES_DB:-task_decomposition_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: task-decomp-redis-prod
    ports:
      - "6381:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - task-decomp-prod-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Express API server (production build) ───────────────────────
  server:
    build:
      context: .
      target: backend
    container_name: task-decomp-server-prod
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yourdomain.com}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Z.AI (OpenAI-compatible) — powers AI task decomposition
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5-turbo}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-3000000}
      # Encryption key for user API keys stored at rest
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Public decompose API (X-API-Key header); empty disables it (503)
      DECOMPOSE_API_KEY: ${DECOMPOSE_API_KEY:-}
      # Feature flags
      ENABLE_AI_DECOMPOSITION: ${ENABLE_AI_DECOMPOSITION:-true}
      ENABLE_TASK_GRAPH: ${ENABLE_TASK_GRAPH:-true}
      ENABLE_COMMENTS: ${ENABLE_COMMENTS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - task-decomp-prod-network

  # ─── Next.js frontend (production build) ─────────────────────────
  app:
    build:
      context: .
      target: frontend
      args:
        # Inlined into the client bundle at `next build` time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: task-decomp-frontend-prod
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    restart: always
    networks:
      - task-decomp-prod-network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  task-decomp-prod-network:
    driver: bridge
