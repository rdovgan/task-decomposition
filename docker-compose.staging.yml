services:
  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: task-decomp-db-staging
    environment:
      POSTGRES_USER: taskdecomp
      POSTGRES_PASSWORD: taskdecomp
      POSTGRES_DB: task_decomposition_staging
    ports:
      - "5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - task-decomp-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskdecomp -d task_decomposition_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: task-decomp-redis-staging
    ports:
      - "6380:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - task-decomp-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Express API server ──────────────────────────────────────────
  server:
    build:
      context: .
      target: dev
    container_name: task-decomp-server-staging
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://taskdecomp:taskdecomp@postgres:5432/task_decomposition_staging?schema=public
      PORT: 3001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ALLOWED_ORIGINS: https://staging.yourdomain.com,https://staging-api.yourdomain.com
      JWT_SECRET: ${JWT_SECRET:-staging-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev:server
    restart: unless-stopped
    networks:
      - task-decomp-staging-network

  # ─── Next.js frontend ────────────────────────────────────────────
  app:
    build:
      context: .
      target: dev
    container_name: task-decomp-frontend-staging
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://taskdecomp:taskdecomp@postgres:5432/task_decomposition_staging?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    command: npm run dev
    restart: unless-stopped
    networks:
      - task-decomp-staging-network

volumes:
  postgres_staging_data:
  redis_staging_data:
  server_node_modules:
  app_node_modules:
  app_next:

networks:
  task-decomp-staging-network:
    driver: bridge
