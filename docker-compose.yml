services:
  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: task-decomp-db
    environment:
      POSTGRES_USER: taskdecomp
      POSTGRES_PASSWORD: taskdecomp
      POSTGRES_DB: task_decomposition
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-decomp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskdecomp -d task_decomposition"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis (session cache, future features) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: task-decomp-redis
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - task-decomp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Express API server (backend) ────────────────────────────────
  server:
    build:
      context: .
      target: dev
    container_name: task-decomp-server
    ports:
      - "3003:3001"
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://taskdecomp:taskdecomp@postgres:5432/task_decomposition?schema=public
      PORT: 3001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5-turbo}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,https://task.dovg.cloud,http://task.dovg.cloud,https://codereview.mybookingpal.com
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev:server
    restart: unless-stopped
    networks:
      - task-decomp-network

  # ─── Next.js frontend ────────────────────────────────────────────
  app:
    build:
      context: .
      target: dev
    container_name: task-decomp-frontend
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://taskdecomp:taskdecomp@postgres:5432/task_decomposition?schema=public
      NEXT_PUBLIC_API_URL: https://task.dovg.cloud
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    command: npm run dev
    restart: unless-stopped
    networks:
      - task-decomp-network

  # ─── Prisma Studio (optional, use: docker compose --profile tools up) ──
  studio:
    build:
      context: .
      target: dev
    container_name: task-decomp-studio
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - studio_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://taskdecomp:taskdecomp@postgres:5432/task_decomposition?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio --browser none --hostname 0.0.0.0
    networks:
      - task-decomp-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  server_node_modules:
  app_node_modules:
  app_next:
  studio_node_modules:

networks:
  task-decomp-network:
    driver: bridge
